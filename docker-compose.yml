services:
  fyntrac-py-model:
    build:
      context: .
      dockerfile: Dockerfile
    # No fixed container_name / host port below: both collide across replicas
    # and would make `docker compose up --scale fyntrac-py-model=N` (N>1)
    # fail outright. The model-execution pipeline runs entirely over Pulsar
    # (Shared subscription — multiple instances split the chunk messages
    # between them automatically, no code change needed), not this REST API,
    # so losing the fixed host port is low-risk. `docker compose ps` /
    # `docker compose logs fyntrac-py-model` still work by service name
    # regardless of the per-replica container name Compose assigns.
    ports:
      - "8090"
    environment:
      # MongoDB
      MONGODB_HOST: ${MONGODB_HOST:-mongodb}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-root}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-R3s3rv#313}
      MONGODB_AUTH_DATABASE: ${MONGODB_AUTH_DATABASE:-admin}
      MONGODB_DEFAULT_DATABASE: ${MONGODB_DEFAULT_DATABASE:-master}
      # Pulsar
      PULSAR_SERVICE_URL: ${PULSAR_SERVICE_URL:-pulsar://pulsar:6650}
      # Memcached
      MEMCACHED_HOST: ${MEMCACHED_HOST:-memcached}
      MEMCACHED_PORT: ${MEMCACHED_PORT:-11211}
      # ZITADEL
      ZITADEL_ISSUER_URI: ${ZITADEL_ISSUER_URI}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3030}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      # Caps the per-instance model-execution process pool. Leave unset for a
      # single replica (auto-sizes to every core Docker gives the container).
      # Set this — and add a matching `deploy.resources.limits.cpus` above —
      # when running --scale N>1 on one host, so each replica claims only
      # its share of the cores instead of every replica sizing to all of
      # them. See MAX_PROCESS_WORKERS in app/config.py.
      # MAX_PROCESS_WORKERS: 10
    networks:
      - fyntrac-network

networks:
  fyntrac-network:
    external: true
